<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>404 - Page Not Found | YADDE TECHNOLOGIES</title>
  <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, "Helvetica Neue", Arial, sans-serif;
      line-height: 1.6;
      color: #f1f5f9;
      background-color: #070b14;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 1.5rem;
    }
    .card {
      max-width: 480px;
      width: 100%;
      background: #0a0f1d;
      padding: 3rem 2rem;
      border-radius: 16px;
      border: 1px solid #1e293b;
      text-align: center;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
    }
    .brand {
      margin-bottom: 1.5rem;
    }
    .brand-name {
      font-size: 1.25rem;
      font-weight: 800;
      color: #ffffff;
      letter-spacing: -0.02em;
    }
    .brand-sub {
      display: block;
      font-size: 0.6875rem;
      font-weight: 600;
      letter-spacing: 0.2em;
      color: #94a3b8;
      text-transform: uppercase;
      margin-top: 2px;
    }
    .code {
      font-size: 0.8125rem;
      font-weight: 700;
      color: #38bdf8;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      margin-bottom: 0.5rem;
    }
    h1 { font-size: 1.75rem; font-weight: 800; color: #ffffff; margin-bottom: 0.75rem; }
    p { color: #94a3b8; margin-bottom: 2rem; font-size: 0.95rem; }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0.75rem 1.5rem;
      background-color: #0284c7;
      color: #ffffff;
      font-weight: 600;
      font-size: 0.875rem;
      border-radius: 10px;
      text-decoration: none;
      transition: background-color 0.15s ease;
    }
    .btn:hover { background-color: #0369a1; }
  </style>
</head>
<body>
  <div class="card">
    <div class="brand">
      <div class="brand-name">YADDE</div>
      <span class="brand-sub">TECHNOLOGIES</span>
    </div>
    <div class="code">404 Error</div>
    <h1>Page Not Found</h1>
    <p>The page you are looking for does not exist or has been moved.</p>
    <a href="./" class="btn">Return to Homepage</a>
  </div>
</body>
</html>
